<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>SiteOfSight Viewer</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
               background:#20232A; -webkit-user-select:none; user-select:none;
               -webkit-tap-highlight-color:transparent; font-family:-apple-system,Roboto,sans-serif; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  .label { position:absolute; transform:translate(-50%,-50%); padding:4px 9px; border-radius:999px;
           font-size:12px; font-weight:600; color:#fff; background:rgba(20,22,28,.82);
           border:1px solid rgba(255,255,255,.14); white-space:nowrap; }
  .label.dist { background:rgba(37,99,235,.92); }
  .label.angle{ background:rgba(217,119,6,.92); }
  .label.laser{ background:rgba(239,68,68,.92); }
  .label.preview { background:rgba(20,22,28,.55); border-style:dashed; display:none; }
  #snap { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
          border:2px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.9); display:none; }
  #hud { position:absolute; left:10px; top:10px; font-size:11px; color:rgba(255,255,255,.55);
         font-variant-numeric:tabular-nums; display:none; }
  #crosshair { position:absolute; width:56px; height:56px; margin:-28px 0 0 -28px; display:none;
               border-radius:50%; border:2px solid rgba(255,255,255,.85);
               background:rgba(20,22,28,.18); box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); }
  #crosshair::before { left:50%; top:8px; bottom:8px; width:2px; margin-left:-1px; }
  #crosshair::after { top:50%; left:8px; right:8px; height:2px; margin-top:-1px; }
  #crosshair.snapped { border-color:#2563EB; background:rgba(37,99,235,.22); }
  #crosshair.snapped::before, #crosshair.snapped::after { background:#2563EB; }
  /* Boyut/konum (width/height/bottom/margin-left) JS ile ayarlanir - bkz.
     app.js positionMinimapFrame() - iki joystick arasindaki GERCEK bosluga
     gore hesaplanir, ekran genisligine ve RN guvenli alanina gore degisir.
     3B icerik (GL) bu kartin icinde, kenarlardan bosluk birakan kucuk bir
     karede cizilir (renderMinimap) - ".frame" o karenin etrafini "harita"
     olarak okunacak bir kart gibi cerceveler (hafif koyu leke + kenarlik +
     golge), ".compass" ise sabit-kuzey yonunu belirten bir rozet. */
  #minimap { position:absolute; left:50%; display:none; pointer-events:none; }
  /* Cerceve bir "border" ile cizilir (background DEGIL) - boylece sadece
     kenar halkasi koyulasir, GL icerigi (harita) ortada tertemiz kalir.
     Border kalinligi app.js'teki MINIMAP_PAD_CSS ile AYNI olmali. */
  #minimap .frame {
    position:absolute; inset:0; border-radius:12px;
    border:7px solid rgba(15,17,23,.55);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.55), 0 3px 12px rgba(0,0,0,.4);
  }
  #minimap .compass {
    position:absolute; top:-9px; left:50%; width:18px; height:18px;
    margin-left:-9px; border-radius:50%;
    background:rgba(16,18,24,.92); border:1.5px solid rgba(255,255,255,.6);
    color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center;
  }
  /* Bolunmus ekran: ustte kat plani panosu. GORSEL icerik (harita) app.js'teki
     renderPlanPane() ile AYNI canvas uzerine scissor/viewport'la cizilir -
     bu div, arka planı seffaf birakip sadece o bolgedeki dokunuslari
     (pan/pinch-zoom/tap) yakalamak icin uzerine biner. Boyut/konum
     app.js computeLayout() ile ayarlanir. */
  #planPane { position:absolute; display:none; touch-action:none; }
  /* Plan ile 3B arasindaki suruklenebilir ayirici: dikey surukleme
     planSplitFrac'i degistirir (bkz. app.js setupPlanDivider). Renkleri
     (arka plan/kenarlik/tutamac) RN temasindan gelir - bkz. app.js
     styleDivider(); buradaki degerler sadece renkler RN'den gelmeden onceki
     ilk boyama icin varsayilandir. Tutamac, bir alt-sayfa (bottom sheet)
     surukleme koluna benzeyen yuvarlatilmis bir "hap" - suruklenirken
     (.dragging) biraz buyuyup belirginlesir, tutuldugu belli olsun diye. */
  #planDivider {
    position:absolute; left:0; right:0; display:none; touch-action:none;
    background:rgba(23,27,34,.96);
    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
    cursor:ns-resize;
  }
  #planDivider .handle {
    position:absolute; left:50%; top:50%; width:42px; height:5px;
    margin:-2.5px 0 0 -21px; border-radius:3px;
    background:rgba(84,114,224,.92);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition: width .12s ease, height .12s ease, margin .12s ease, opacity .12s ease;
  }
  #planDivider.dragging .handle {
    width:56px; height:6px; margin:-3px 0 0 -28px; opacity:.85;
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="overlay"><div id="snap"></div><div id="crosshair"></div><div id="hud"></div></div>
  <div id="minimap"><div class="frame"></div><div class="compass">N</div></div>
  <div id="planPane"></div>
  <div id="planDivider"><div class="handle"></div></div>

  <!-- Vendor: klasik script (ESM DEĞİL) -> file:// altında CORS sorunu yaşanmaz -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/web-ifc-api-iife.js"></script>

  <script src="./js/util.js"></script>
  <script src="./js/bridge.js"></script>
  <script src="./js/controls.js"></script>
  <script src="./js/viewcube.js"></script>
  <script src="./js/ifc.js"></script>
  <script src="./js/tools.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
